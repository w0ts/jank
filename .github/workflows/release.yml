# SPDX-License-Identifier: GPL-3.0-only
# A release from a tag: `git tag -a v0.1.3 -m "..." && git push origin v0.1.3`.
# It builds the release image (scripts/build.sh auto: the XIAO or the jank mini 3, told apart at the start) in Espressif's
# ESP-IDF container, writes the release's assets (scripts/publish_firmware.py: every flash part and the manifest
# jank-auto-TAG.json), makes the GitHub release with them attached (the app image jank-auto-TAG.bin is also what a copy
# onto the JANK drive takes), then starts the Pages workflow, which puts them on the site for the Install page.
# The host tests (tests/run.sh) stay on the Mac before tagging: they need node, madmom's model and Optimist's sources.
# No network weights are built or published: the Install page adds madmom's at the user's click (docs/beat.md).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write            # the release
  actions: write             # starts the Pages workflow

concurrency:
  group: release             # one release at a time
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.5.6
    steps:
      - name: Tools the scripts use
        run: apt-get update -qq && apt-get install -y -qq rsync unzip curl git > /dev/null

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # the tag

      - name: Git in the container
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --quiet --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - name: Build the release image
        shell: bash
        env:
          JANK_IDF_FROM_ENV: "1"
          JANK_JOBS: "4"
        run: bash scripts/build.sh auto

      - name: The release's assets (every part, the manifest)
        shell: bash
        run: python3 -I scripts/publish_firmware.py "$GITHUB_REF_NAME" --no-build

      - name: The GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: worktrees/jank-scratch/release/${{ github.ref_name }}/*
          body: |
            Flash it from the browser: https://w0ts.github.io/jank/install.html (a running Jank: Update over USB MIDI; a new device: Flash a new device).
            The attached jank-auto-${{ github.ref_name }}.bin is the app image alone, for a copy onto the device's JANK drive (it updates a device that already runs Jank).
      - name: The site (firmware/ for the Install page)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/pages.yml/dispatches" -d '{"ref":"main"}'
