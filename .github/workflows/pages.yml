# SPDX-License-Identifier: GPL-3.0-only
# The site, https://w0ts.github.io/jank/, from main: the committed pages (page/, `make page`), the device page with the
# w0ts project switcher, img/, and firmware/ for the Install page made from the GitHub releases' assets
# (scripts/site_tree.py). No branch holds the site. It runs when the pages change on main, after a release
# (release.yml starts it), or by hand from the Actions tab.
name: pages
on:
  push:
    branches: [main]
    paths: ['page/**', 'scripts/site_tree.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Lay out the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 -I scripts/site_tree.py _site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
